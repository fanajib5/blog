{{ define "main" }}
<main class="wrapper">
  <h1>Content Series</h1>

  <ul class="lsn post-list">
    {{ range .Data.Terms.Alphabetical -}}
    <li class="post-item">
      <span class="dim">{{ .Count }} artikel</span>
      <a href="{{ .Page.RelPermalink }}" class="post-title"
        >{{ .Page.Title }}</a
      >
    </li>
    {{- else }}
    <li class="post-item dim">Belum ada seri yang dipublikasikan.</li>
    {{- end }}
  </ul>
</main>
{{- end }}
