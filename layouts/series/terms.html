{{ define "main" }}
<main class="wrapper">
  <h1><a href="/" class="home">Content Series</a></h1>

  <ul class="lsn post-list">
    {{ range .Data.Terms.Alphabetical -}}
    <li class="post-item">
      <span class="dim">{{ .Pages.Len }} artikel</span>
      <a href="{{ .RelPermalink }}" class="post-title">{{ .Title }}</a>
    </li>
    {{- else }}
    <li class="post-item dim">Belum ada seri yang dipublikasikan.</li>
    {{- end }}
  </ul>
</main>
<hr />
{{- end }}
